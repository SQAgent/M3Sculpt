[project]
name = "m3s"
version = "0.0.1"
description = "M3Sculptor: mechanical metamaterial design assistant."
authors = [
    { name = "shangqing", email = "shangqing@shu.edu.cn" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "langgraph>=1.1.3,<2",
    "numpy>=1.24",
    "scipy>=1.12",
    "trimesh>=4.0",
    "neo4j>=5,<7",
    "pymongo>=4,<5",
    "pymilvus>=2.4,<4",
    "requests>=2.32",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest>=8.3.5"]
normal = ["dashscope>=1.25", "scikit-image>=0.22", "Pillow>=10"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["m3s*"]


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
